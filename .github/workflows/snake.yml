name: Generate Snake

on:
  # اجرای خودکار هر ۲۴ ساعت
  schedule:
    - cron: "0 0 * * *" 
  
  # امکان اجرای دستی اکشن
  workflow_dispatch:
  
  # اجرا هنگام پوش کردن در شاخه main
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # تولید دو نسخه روشن و تاریک
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # فایلهای تولید شده در این شاخه ذخیره میشوند
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
